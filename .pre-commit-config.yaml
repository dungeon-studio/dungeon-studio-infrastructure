# Pre-commit hooks for code quality and consistency
# See https://pre-commit.com for more information

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File formatting
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # Syntax validation
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML tags
      - id: check-json
        exclude: '\.jsonc$'
      - id: check-toml

      # Prevent issues
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

      # Git hygiene
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main]

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        # Keep --write. It is one of the hook's default args, and pre-commit
        # replaces those wholesale rather than appending; without it shfmt
        # writes to stdout and exits 0 on files it would have rewritten.
        args: [--write, -i, '2', -ci]

  # Terraform. terraform_validate is absent by design: it needs backend
  # initialization and GCS authentication via workload identity federation,
  # which a commit hook cannot provide.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        args: [--args=-recursive]
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL

  # REUSE — SPDX license compliance
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        always_run: true

  # GitHub Actions static analysis. Offline needs no credentials; the
  # online supply-chain audits need a token.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  # Secrets detection. Neither zizmor nor `trivy config` looks for secrets,
  # and this repository handles cloud credentials directly.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # Renovate config validation
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.34.0
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # justfile format and parse check
  - repo: local
    hooks:
      - id: just-fmt-check
        name: just --fmt --check
        entry: just --fmt --check
        language: system
        files: ^justfile$
        pass_filenames: false
