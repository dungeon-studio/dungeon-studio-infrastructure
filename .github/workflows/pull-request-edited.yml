---
name: Pull request edited

# Run on every pull request: a required check that never reports blocks the
# merge. Retargeting a base sends only edited, which reruns the check against
# the new base.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rulesets on GitHub Free cannot restrict a pull request's source branch, so
  # the github_repository module requires this check on main and release/**.
  git-flow-source:
    name: Check Git flow source branch
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check the source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${BASE_REF}" == main && "${HEAD_REF}" != release/* && "${HEAD_REF}" != hotfix/* ]]; then
            echo "::error::Pull requests into main come from release/* or hotfix/*, not ${HEAD_REF}."
            exit 1
          fi
