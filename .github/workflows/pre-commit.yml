---
name: Pre-commit

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a push to a long-lived
  # branch, so every commit on it keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The only runner, so a hook added to .pre-commit-config.yaml is enforced
  # without touching this file.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # renovate: datasource=github-releases depName=casey/just
      JUST_VERSION: '1.58.0'
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: '1.15.9'
      # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
      TRIVY_VERSION: '0.74.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # terraform and trivy back terraform_fmt and terraform_trivy, which match
      # no file until terraform/ lands. Installed ahead of it so the first
      # commit of Terraform arrives already gated.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_URL=https://github.com/aquasecurity/trivy/releases/download
          curl -fsSL \
            "${TRIVY_URL}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy

      - name: Install just
        run: |
          set -euo pipefail
          JUST_URL=https://github.com/casey/just/releases/download
          curl -fsSL \
            "${JUST_URL}/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin just

      - name: Run hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # no-commit-to-branch guards local commits against develop and main,
          # and a push-event checkout is attached to the very branch it guards,
          # so it would fail every merge.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files
