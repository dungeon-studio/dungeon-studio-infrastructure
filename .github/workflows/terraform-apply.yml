---
name: Terraform apply

# Bootstrap applies by hand: CI cannot reach its state (README §Layout).
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - terraform/infrastructure/**
      - terraform/modules/**
      - scripts/export-terraform-credentials.sh
      - .github/workflows/terraform-apply.yml

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Apply Terraform infrastructure layer
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # Shared with the pull request plan so a plan never reads state
    # mid-write. queue: max keeps a later plan from replacing a pending apply.
    concurrency:
      group: terraform-state
      queue: max

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: terraform

      # The deployer's Workload Identity binding admits only refs/heads/develop,
      # so a dispatch from any other ref fails here.
      - name: Authenticate as the read-write deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_RW_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Export provider credentials
        run: '"${GITHUB_WORKSPACE}/scripts/export-terraform-credentials.sh" rw'

      - name: Initialize Terraform
        run: terraform init -input=false

      # Applying the saved plan keeps the run log's plan and the applied
      # change identical.
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color tfplan
