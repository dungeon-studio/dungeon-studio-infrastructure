---
name: CI

# Sensors that run unconditionally on an integration event. A check with a
# narrower "when" — a schedule, or a path gate — earns its own file.

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push to a long-lived branch, so every commit on it keeps a
  # result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Adding a hook to .pre-commit-config.yaml is usually all it takes. One that
  # shells out to a binary the runner lacks also needs an entry in mise.toml.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up hook tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Run hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # A push-event checkout is attached to the very branch
          # no-commit-to-branch guards, so the hook would fail every merge.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files

  # The commit hooks omit terraform_validate because it needs an initialized
  # working directory. Initializing without a backend needs no credentials, so
  # fork pull requests run this job too.
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: terraform

      - name: Validate each layer
        env:
          # Validate checks that app_auth's arguments are set but never
          # configures the provider.
          GITHUB_APP_ID: placeholder
          GITHUB_APP_INSTALLATION_ID: placeholder
          GITHUB_APP_PEM_FILE: placeholder
        run: |
          set -euo pipefail
          for layer in terraform/bootstrap terraform/infrastructure; do
            terraform -chdir="${layer}" init -backend=false -input=false
            terraform -chdir="${layer}" validate
          done
