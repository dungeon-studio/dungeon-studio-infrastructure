---
name: CI

# Sensors that run unconditionally on an integration event. A check with a
# narrower "when" — a schedule, or a path gate — earns its own file.

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push to a long-lived branch, so every commit on it keeps a
  # result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Adding a hook to .pre-commit-config.yaml is usually all it takes. One that
  # shells out to a binary the runner lacks also needs an install step below.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # renovate: datasource=github-releases depName=casey/just
      JUST_VERSION: '1.58.0'
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: '1.15.9'
      # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
      TRIVY_VERSION: '0.75.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper exists to expose stdout, stderr, and exitcode as step
          # outputs. pre-commit invokes terraform itself, so nothing reads them.
          terraform_wrapper: false

      - name: Install Trivy
        run: |
          set -euo pipefail
          RELEASE_URL=https://github.com/aquasecurity/trivy/releases/download
          ARCHIVE=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -fsSL "${RELEASE_URL}/v${TRIVY_VERSION}/${ARCHIVE}" | sudo tar -xz -C /usr/local/bin trivy

      - name: Install just
        run: |
          set -euo pipefail
          RELEASE_URL=https://github.com/casey/just/releases/download
          ARCHIVE=just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL "${RELEASE_URL}/${JUST_VERSION}/${ARCHIVE}" | sudo tar -xz -C /usr/local/bin just

      - name: Run hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # A push-event checkout is attached to the very branch
          # no-commit-to-branch guards, so the hook would fail every merge.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files
