extends: default

rules:
  # SHA-pinned GitHub Actions (`uses: org/repo@<40-char-sha> # vN`) and the
  # single-line `# renovate:` comments that pin tool versions both exceed the
  # 80-char default and cannot be wrapped. 120 matches the product monorepo.
  line-length:
    max: 120
  # Renovate writes a single space before its trailing version comment
  # (e.g. `... # v4`); accept that style.
  comments:
    min-spaces-from-content: 1
  # GitHub Actions uses 'on:' as a top-level key; without this, every workflow
  # file would have to quote it.
  truthy:
    check-keys: false
