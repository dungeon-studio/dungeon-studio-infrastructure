extends: default

rules:
  # SHA pins (`uses: org/repo@<sha> # vN`) and single-line `# renovate:`
  # version comments cannot be wrapped. 120 matches the product monorepo.
  line-length:
    max: 120
  # Renovate writes a single space before its trailing version comment
  # (e.g. `... # v4`); accept that style.
  comments:
    min-spaces-from-content: 1
  # GitHub Actions uses 'on:' as a top-level key; without this, every workflow
  # file would have to quote it.
  truthy:
    check-keys: false
