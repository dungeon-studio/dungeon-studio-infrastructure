# SPDX-License-Identifier: MIT

# Copyright and licensing for files that cannot carry inline SPDX headers.

version = 1
SPDX-PackageName = "dungeon-studio-infrastructure"
SPDX-PackageSupplier = "Alex Brandt <alunduil@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/dungeon-studio/dungeon-studio-infrastructure"

# Regenerated by terraform init, so an inline header would not survive.
[[annotations]]
path = ["**/.terraform.lock.hcl"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt <alunduil@gmail.com>"
SPDX-License-Identifier = "MIT"

# Left behind by Claude Code sessions. These stay untracked, but nothing
# gitignores them, and reuse lint walks any path git does not ignore.
[[annotations]]
path = [".claude/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt <alunduil@gmail.com>"
SPDX-License-Identifier = "MIT"

# JSON has no comment syntax to carry an inline header.
[[annotations]]
path = ["**.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt <alunduil@gmail.com>"
SPDX-License-Identifier = "MIT"
